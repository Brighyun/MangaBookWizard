name: Build MangaBookWizard for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Download project source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller certifi
          python -m pip install -r requirements.txt

      - name: Run app tests
        run: python -m unittest discover -v

      - name: Build Windows EXE
        run: >
          python -m PyInstaller
          --clean
          --onefile
          --windowed
          --noupx
          --hidden-import=_cffi_backend
          --icon icons/manga-book-wizard.ico
          --name MangaBookWizard.v01-Windows-x64
          manga_book_wizard.py

      - name: Confirm EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/MangaBookWizard.v01-Windows-x64.exe")) {
            throw "The Windows EXE was not created."
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MangaBookWizard.v01-Windows-x64
          path: dist/MangaBookWizard.v01-Windows-x64.exe
          if-no-files-found: error
